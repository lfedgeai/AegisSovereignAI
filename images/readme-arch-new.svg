  <!-- ATTESTATION FLOW & KILL-SWITCH PATH -->
  <path d="M 545 400 L 545 300" stroke="#43A047" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowhead-green)" />
  <path d="M 545 230 L 545 140" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead-red)" />
  <text x="555" y="170" font-family="Arial" font-size="10" fill="#D32F2F" font-weight="bold">REVOKE on Drift</text>
  <text x="555" y="320" font-family="Arial" font-size="10" fill="#43A047" font-weight="bold">Attestation Path</text>

  <!-- MARKERS -->
  <defs>
