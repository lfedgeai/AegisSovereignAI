[package]
name = "zkp-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkp-prover"
path = "src/main.rs"

[dependencies]
plonky2 = "0.2"
plonky2_field = "0.2"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[profile.release]
lto = true
codegen-units = 1
